[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agentdoctor"
version = "0.5.0"
description = "Find out why your AI agent is expensive, slow or unreliable, and how to fix it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kushagra Sharma" }]
keywords = ["llm", "agents", "observability", "mcp", "evaluation", "tracing", "opentelemetry",
            "langfuse", "langsmith"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
hf = [
    "huggingface_hub>=0.28",
]
mcp = [
    "mcp>=2.3,<3",
]
dev = [
    "agentdoctor[mcp]",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/kushagra2304/agent-doctor"
Source = "https://github.com/kushagra2304/agent-doctor"
Issues = "https://github.com/kushagra2304/agent-doctor/issues"
Changelog = "https://github.com/kushagra2304/agent-doctor/blob/main/CHANGELOG.md"

[project.scripts]
agent-doctor = "agent_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
