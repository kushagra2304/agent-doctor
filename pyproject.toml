[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-doctor"
version = "0.2.0"
description = "Find out why your AI agent is expensive, slow or unreliable, and how to fix it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kushagra Sharma" }]
keywords = ["llm", "agents", "observability", "mcp", "evaluation", "tracing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
hf = [
    "huggingface_hub>=0.28",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
agent-doctor = "agent_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
